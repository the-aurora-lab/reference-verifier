[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reference-verifier"
version = "0.1.0"
description = "Check that every reference in your paper exists, against Crossref, OpenAlex, DBLP, arXiv and PubMed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aurora Lab", email = "auroralab.skills@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "bibtexparser>=1.4,<2",
]
keywords = ["bibtex", "citations", "references", "latex", "hallucinated citations", "crossref", "research integrity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Source = "https://github.com/the-aurora-lab/reference-verifier"
Issues = "https://github.com/the-aurora-lab/reference-verifier/issues"

[project.scripts]
refverify = "reference_verifier.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/reference_verifier"]

[tool.hatch.build.targets.sdist]
exclude = ["benchmark/data/raw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live scholarly APIs (deselect with -m 'not network')"]
