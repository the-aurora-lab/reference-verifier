[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reference-verifier"
version = "0.2.2"
description = "Check that every reference in your paper exists, against Crossref, OpenAlex, DBLP, arXiv and PubMed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aurora Lab", email = "auroralab.skills@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "bibtexparser>=1.4,<2",
]
keywords = ["bibtex", "citations", "references", "latex", "hallucinated citations", "crossref", "research integrity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://the-aurora-lab.github.io/tools/reference-verifier/"
Source = "https://github.com/the-aurora-lab/reference-verifier"
Issues = "https://github.com/the-aurora-lab/reference-verifier/issues"
Changelog = "https://github.com/the-aurora-lab/reference-verifier/blob/main/CHANGELOG.md"

[project.scripts]
refverify = "reference_verifier.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/reference_verifier"]

[tool.hatch.build.targets.sdist]
# The benchmark data stays in the repository: the package needs none of it.
include = ["src/reference_verifier", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live scholarly APIs (deselect with -m 'not network')"]
