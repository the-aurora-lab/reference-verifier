# Builds and tests the package on every push to main and every pull request.
# When a GitHub release is published, the same build is uploaded to PyPI through
# Trusted Publishing (no API token; PyPI trusts this workflow file in this repository).
name: build and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist
      - name: pyproject.toml and __init__.py give the same version
        run: |
          python - <<'EOF'
          import re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = open("src/reference_verifier/__init__.py", encoding="utf-8").read()
          found = re.search(r'__version__ = "([^"]+)"', init).group(1)
          assert found == version, (found, version)
          EOF
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the package version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the wheel on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel and run the offline tests against it
        run: |
          python -m pip install dist/*.whl pytest
          refverify --version
          python - <<'EOF'
          import importlib.metadata, reference_verifier
          installed = importlib.metadata.version("reference-verifier")
          assert reference_verifier.__version__ == installed, (reference_verifier.__version__, installed)
          assert "site-packages" in reference_verifier.__file__, reference_verifier.__file__
          EOF
          python -m pytest -m "not network" -q

  publish:
    name: Upload to PyPI
    needs: [build, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reference-verifier
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
